name: MacMonitorWidget
options:
  bundleIdPrefix: tech.macmonitorwidget
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # Version kommt aus version.json (scripts/make_app.sh reicht sie an xcodebuild).
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Signatur erfolgt nach dem Bauen per codesign (wie beim Menüleisten-Programm),
    # damit kein Provisioning-Profil nötig ist.
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    OTHER_LDFLAGS: "-framework IOKit"

targets:
  MacMonitorWidget:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/App
    dependencies:
      - target: MacMonitorWidgetExtension
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: MacMonitorWidget
        CFBundleDisplayName: MacMonitorWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.macmonitorwidget.app
        CODE_SIGN_ENTITLEMENTS: Sources/App/App.entitlements

  MacMonitorWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widget
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleName: MacMonitorWidgetExtension
        CFBundleDisplayName: MacMonitorWidget
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.macmonitorwidget.app.widget
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/Widget.entitlements
